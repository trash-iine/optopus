[package]
name = "optopus"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A metaheuristic optimization library for combinatorial problems (MaxCut, QUBO, SAT, TSP, and more)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/trash-iine/optopus"
readme = "README.md"
keywords = ["optimization", "metaheuristics", "simulated-annealing", "tabu-search", "maxcut"]
categories = ["algorithms", "science", "mathematics"]
authors = ["Trash-iine"]
exclude = ["data/", "docs/", "result/", ".claude/", ".github/"]

[dependencies]
rand = "0.9.2"
rand_chacha = "0.9.0"
thiserror = "2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
rayon = "1.11.0"
serde = { version = "1.0.228", features = ["derive"] }
toml = "0.9.8"
glob = "0.3.3"
chrono = "0.4.42"

[profile.release]
# `fat` rather than `thin`, and measured. It is worth 8-10% on the heuristics
# whose inner loop is a neighborhood scan -- RandomWalk -9.5%, SimulatedAnnealing
# -7.9% on a 40M-move MaxCut walk -- and it is what keeps `TabuSearch` off a
# cliff: the tabu memory's `dense` buffer, the solution's gains and the graph's
# vertex list are walked in lockstep, so where the allocator happens to put them
# decides whether they collide in the cache. Under `thin` one arrangement cost
# +47% on G32; under `fat` the same arrangement is within noise. Costs ~6s of
# build time. See `src/common/tabu.rs`.
lto = "fat"
codegen-units = 1
