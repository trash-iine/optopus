site_name: Optopus
site_description: A metaheuristic optimization library for combinatorial problems, written in Rust.
site_url: https://trash-iine.github.io/optopus/
repo_url: https://github.com/trash-iine/optopus
repo_name: trash-iine/optopus
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

# `docs/ja/` is the Japanese edition of every page but the benchmarks. The
# language menu in the header switches between the two front pages; the links
# are relative to the site root, which `url` resolves per page.
extra:
  alternate:
    - name: English
      link: ./
      lang: en
    - name: 日本語
      link: ja/
      lang: ja

# The default search tokenizer splits on whitespace only, which leaves Japanese
# text unsearchable; listing `ja` adds its segmenter.
plugins:
  - search:
      lang:
        - en
        - ja

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.superfences
  - toc:
      permalink: true

# `docs/api/` is rustdoc output (`cargo doc --no-deps --lib`, then copy
# `target/doc` there), not a checked-in page: build it before building the site,
# or every `../api/...` link below fails the `--strict` check.
#
# `render.py` is the tool that produces the viewer's data, not a page of the
# site. The raw result TOMLs are gitignored, so on CI there is nothing to drop;
# the pattern keeps a local build matching what CI publishes.
exclude_docs: |
  benchmarks/render.py
  benchmarks/data/*.toml
  !benchmarks/data/*.slim.toml

# rustdoc ships a Markdown font license under `static.files/`, which would
# otherwise be reported as a page missing from the nav. Nothing under `api/`
# belongs in the nav — the single entry below is its front door.
not_in_nav: |
  api/**

# `mkdocs build --strict` turns every one of these into a build failure, which
# is what keeps a relative link from silently pointing outside the site again.
validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: relative_to_docs
    unrecognized_links: warn

nav:
  - Home: README.md
  - API reference (rustdoc): api/optopus/index.html
  - Getting started:
      - Quickstart: quickstart.md
      - Concepts: concepts.md
      - SearchState API: search_state.md
      - Core traits: traits.md
  - Problems:
      - Overview: problems/README.md
      - MaxCut: problems/max_cut.md
      - MaxCut kernelization: problems/max_cut_kernel.md
      - QUBO: problems/qubo.md
      - MaxSAT: problems/sat.md
      - TSP: problems/tsp.md
      - Vertex Cover: problems/vertex_cover.md
      - Job Shop Scheduling: problems/job_shop_scheduling.md
      - CVRP: problems/vrp.md
      - Graph Coloring: problems/graph_coloring.md
      - Formula: problems/formula.md
  - Heuristics:
