# AdaptiveIteratedLocalSearch against the other CVRP searches, on four
# CVRPLIB X instances. The measurement of decisions/0027.

num_runs = 5
seed = 42

[[instances]]
path = "data/instances/vrp/X-n214-k11.vrp"
problem = "Vrp"

[[instances]]
path = "data/instances/vrp/X-n303-k21.vrp"
problem = "Vrp"

[[instances]]
path = "data/instances/vrp/X-n401-k29.vrp"
problem = "Vrp"

[[instances]]
path = "data/instances/vrp/X-n1001-k43.vrp"
problem = "Vrp"

[[heuristics]]
kind = "AdaptiveIteratedLocalSearch"
[heuristics.stop_condition]
max_duration_secs = 60.0

[[heuristics]]
kind = "AdaptiveLargeNeighborhoodSearch"
removal_fraction = 0.15
cooling_rate = 0.9995
[heuristics.stop_condition]
max_duration_secs = 60.0

[[heuristics]]
kind = "HybridGeneticSearch"
min_population_size = 25
generation_size = 40
granularity = 20
target_feasible = 0.2
restart_generations = 20000
[heuristics.stop_condition]
max_duration_secs = 60.0
