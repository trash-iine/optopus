name: Deploy docs to GitHub Pages

# One-time setup: in repo Settings → Pages, set Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; cancel in-progress runs of this workflow.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The API reference is part of the site: rustdoc goes to `docs/api/`, so
      # the Markdown links to it with ordinary relative paths that `--strict`
      # then verifies. `--lib` avoids the lib/bin output-filename collision.
      - name: Build rustdoc
        run: |
          cargo doc --no-deps --lib
          rm -rf docs/api
          cp -r target/doc docs/api
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install 'mkdocs-material==9.5.*'
      # `docs/` is the site source: MkDocs renders the Markdown to HTML and
      # copies the viewer, its vendored parser and the committed *.slim.toml +
      # index.json through untouched. `--strict` fails the build on any broken
      # link, which is what keeps a relative link from pointing outside the site.
      - run: mkdocs build --strict --site-dir _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
